# /etc/nginx/nginx.conf

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    log_format debug_proxy
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status '
        'Proxy-to: "$scheme://$proxy_host$request_uri"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;

    server {
        listen 80 default_server;
        server_name 15.207.153.147 _;

        root /usr/share/nginx/html;
        index index.html;

        #  blocks
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (wp-admin|phpmyadmin|\.git) {
            deny all;
        }

        # health
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # =========================
        # 🔥 DB API
        # =========================
        location /db/ {

            proxy_pass https://xbptb25rog.execute-api.ap-south-1.amazonaws.com/DB-ACCESS/db/;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;

            proxy_set_header Host xbptb25rog.execute-api.ap-south-1.amazonaws.com;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;

            proxy_redirect off;

            access_log /var/log/nginx/proxy_debug.log debug_proxy;
        }

        # =========================
        # 🔥 RTSS API
        # =========================

        location /chewie/ {
            # Handle preflight (VERY IMPORTANT for browser)
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass https://j2bqq4kzb6.execute-api.ap-south-1.amazonaws.com/Test/chewie/;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;

            proxy_set_header Host j2bqq4kzb6.execute-api.ap-south-1.amazonaws.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure we pass the body
            proxy_pass_request_body on;
            proxy_set_header Content-Type $content_type;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;

            proxy_redirect off;

            # CORS headers for actual response
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

            access_log /var/log/nginx/rtss_proxy.log debug_proxy;
        }
        # frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

        # static
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            access_log off;
        }
    }
}
